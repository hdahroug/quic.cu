[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quic"
version = "0.1.0"
description = "Qwen Unified Inference on CUDA: Bare-metal fused CUDA inference and continuous batching engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers<4.45.0",
    "accelerate>=0.26.0",
    "safetensors>=0.4.0",
    "tokenizers>=0.19.0",
    "numpy>=1.26.0",
    "ninja>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
